<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgNoir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12110f"/>
      <stop offset="40%" stop-color="#1c1a17"/>
      <stop offset="100%" stop-color="#2b2b2b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c78a"/>
      <stop offset="50%" stop-color="#b8975a"/>
      <stop offset="100%" stop-color="#8a6e38"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgNoir)"/>
  
  <!-- Subtle botanical curve -->
  <path d="M400 30 C300 90, 320 200, 200 240 S50 270, 0 300" fill="none" stroke="#b8975a" stroke-width="1.2" opacity="0.3"/>
  
  <!-- Central Frame Card -->
  <rect x="75" y="25" width="250" height="250" rx="16" fill="rgba(255,255,255,0.03)" stroke="#b8975a" stroke-width="1.5"/>
  <rect x="85" y="35" width="230" height="230" rx="12" fill="none" stroke="#b8975a" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Monogram -->
  <text x="200" y="80" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" letter-spacing="4" fill="url(#goldGrad)">N | A</text>
  
  <!-- Subtitle -->
  <text x="200" y="110" text-anchor="middle" font-family="'Lato', sans-serif" font-size="9" letter-spacing="3" fill="#ffffff" font-weight="bold" opacity="0.8">THE WEDDING CELEBRATION</text>
  
  <!-- Couple Names -->
  <text x="200" y="150" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff">Nella &amp; Arhan</text>
  
  <!-- Divider -->
  <line x1="160" y1="170" x2="240" y2="170" stroke="#b8975a" stroke-width="1"/>
  <circle cx="200" cy="170" r="3" fill="#b8975a"/>
  
  <!-- Date -->
  <text x="200" y="198" text-anchor="middle" font-family="'Philosopher', Georgia, serif" font-size="12" fill="url(#goldGrad)">Minggu, 30 Mei 2027</text>
  
  <!-- Open Button Pill -->
  <rect x="140" y="222" width="120" height="26" rx="13" fill="#ffffff"/>
  <text x="200" y="239" text-anchor="middle" font-family="'Lato', sans-serif" font-size="9" font-weight="bold" fill="#1c1a17" letter-spacing="1">BUKA UNDANGAN</text>
  
  <!-- Fireflies dots -->
  <circle cx="50" cy="60" r="2.5" fill="#f4e27a" opacity="0.7"/>
  <circle cx="340" cy="210" r="3" fill="#f4e27a" opacity="0.8"/>
  <circle cx="330" cy="90" r="2" fill="#f4e27a" opacity="0.6"/>
  <circle cx="65" cy="230" r="2" fill="#f4e27a" opacity="0.5"/>
</svg>
