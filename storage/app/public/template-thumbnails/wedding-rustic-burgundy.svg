<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="50%" stop-color="#3a0000"/>
      <stop offset="100%" stop-color="#6b0000"/>
    </linearGradient>
    <linearGradient id="roseCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcd5d9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Decorative Arch Card -->
  <rect x="80" y="30" width="240" height="240" rx="36" fill="url(#roseCard)" stroke="#fcd5d9" stroke-width="2"/>
  <!-- Inner Frame -->
  <rect x="95" y="45" width="210" height="210" rx="26" fill="none" stroke="#6b0000" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Text Elements -->
  <text x="200" y="80" text-anchor="middle" font-family="'Georgia', serif" font-size="11" letter-spacing="3" fill="#6b0000" font-weight="600">THE WEDDING OF</text>
  <text x="200" y="130" text-anchor="middle" font-family="'Almendra', 'Georgia', serif" font-size="30" font-weight="bold" fill="#3a0000">Deva &amp; Dion</text>
  
  <!-- Botanical Line Ornament -->
  <path d="M140 150 Q170 145 200 150 T260 150" fill="none" stroke="#6b0000" stroke-width="1.5"/>
  <circle cx="200" cy="150" r="3" fill="#6b0000"/>
  
  <text x="200" y="185" text-anchor="middle" font-family="'Georgia', serif" font-size="11" fill="#6b0000" font-style="italic">Kamis, 31 Desember 2026</text>
  
  <!-- CTA Button Mock -->
  <rect x="140" y="208" width="120" height="28" rx="14" fill="#6b0000"/>
  <text x="200" y="226" text-anchor="middle" font-family="'Georgia', serif" font-size="10" font-weight="bold" fill="#fcd5d9" letter-spacing="1">BUKA UNDANGAN</text>
  
  <!-- Petals -->
  <path d="M50 70 C55 60, 65 65, 60 75 C55 85, 45 80, 50 70 Z" fill="#6b0000" opacity="0.6"/>
  <path d="M340 230 C345 220, 355 225, 350 235 C345 245, 335 240, 340 230 Z" fill="#fcd5d9" opacity="0.8"/>
  <path d="M330 60 C335 50, 345 55, 340 65 C335 75, 325 70, 330 60 Z" fill="#6b0000" opacity="0.5"/>
</svg>
